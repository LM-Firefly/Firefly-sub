# fly.toml app configuration file generated for fly-sub on 2024-10-04T07:57:37+08:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'fly-sub'
primary_region = 'sin'

[build]

[http_service]
internal_port = 25500
force_https = true
auto_stop_machines = 'stop'
auto_start_machines = true
min_machines_running = 0
processes = ['app']

[http_service.concurrency]
type = 'requests'
hard_limit = 1440
soft_limit = 720

[[vm]]
memory = '512mb'
cpu_kind = 'shared'
cpus = 1
